# ============================================================================
# dsh-led-bridge —— DSH bundle patch（挂载声明）
# ============================================================================
# 这是插件的“挂载声明”。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件会把状态灯插件插入 profile 的配置树。
#
# 安装方式（官方 CLI）：
#   dsh plugin --profile web add github:<你的用户名>/<仓库名>
# 或本地开发安装：
#   dsh plugin --profile web add link:<本目录绝对路径>
# 或从 tarball 安装（无需构建授权）：
#   dsh plugin --profile web add ./dsh-led-bridge-0.1.0.tgz
# ============================================================================

- insert:
    - id: dsh-led-bridge
      name: dsh-led-bridge
